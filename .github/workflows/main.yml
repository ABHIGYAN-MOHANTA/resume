name: Build LaTeX document

on:
  push:
    branches:
      - main  # Adjust this to your branch if different

jobs:
  build_latex:
    if: contains(github.event.head_commit.message, 'deploy')  # Runs only if the commit message contains 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: main.pdf

  commit_pdf:
    needs: build_latex
    runs-on: ubuntu-latest
    if: needs.build_latex.result == 'success'  # Runs only if build_latex succeeded
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.TOKEN }}  # Use PAT instead of GITHUB_TOKEN

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: PDF

      - name: Commit and push PDF
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated"
          git push
